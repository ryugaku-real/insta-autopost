name: 自動投稿

on:
  schedule:
    - cron: "7 * * * *"   # 毎時7分に予約を確認（GitHubの混雑で数十分遅れることがあります）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "テスト実行（投稿しない）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 足りないスライド画像を作る
        run: |
          pip install -q pillow
          if ! python scripts/render.py --check; then
            sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
            python scripts/render.py
          fi
          if [ -n "$(git status --porcelain --untracked-files=all posts assets)" ]; then
            git config user.name "insta-autopost"
            git config user.email "actions@users.noreply.github.com"
            git add posts assets
            git commit -m "スライド画像を作成"
            git pull --rebase --autostash
            git push
          fi
      - name: リール動画を作る（リポジトリ変数 REELS_ENABLED=1 のときだけ）
        if: ${{ vars.REELS_ENABLED == '1' }}
        run: |
          python scripts/video.py make
          if [ -n "$(git status --porcelain --untracked-files=all posts)" ]; then
            git config user.name "insta-autopost"
            git config user.email "actions@users.noreply.github.com"
            git add posts
            git commit -m "リール動画を作成"
            git pull --rebase --autostash
            git push
          fi
      - name: 予約時刻を過ぎた投稿を公開
        env:
          REELS_ENABLED: ${{ vars.REELS_ENABLED }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          export IMAGE_BASE_URL="https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/ig.py publish --dry-run
          else
            python scripts/ig.py publish
          fi
      - name: YouTubeショートに公開（リポジトリ変数 YOUTUBE_ENABLED=1 のときだけ）
        if: ${{ vars.YOUTUBE_ENABLED == '1' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/youtube.py publish --dry-run
          else
            python scripts/youtube.py publish
          fi
      - name: 公開記録を保存
        if: always()
        run: |
          if [ -n "$(git status --porcelain published.json)" ]; then
            git config user.name "insta-autopost"
            git config user.email "actions@users.noreply.github.com"
            git add published.json
            git commit -m "公開記録を更新"
            git pull --rebase --autostash
            git push
          fi
