name: トークン自動更新

on:
  schedule:
    - cron: "23 9 * * 1"   # 毎週月曜（トークンの有効期限は60日）
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: トークンを更新
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python scripts/ig.py refresh --out "$RUNNER_TEMP/token.txt"
          echo "::add-mask::$(cat "$RUNNER_TEMP/token.txt")"
      - name: 新しいトークンを Secrets に保存
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT が未設定なので Secrets を書き換えられません。手順書の「トークン自動更新」を設定してください。"
          else
            gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" < "$RUNNER_TEMP/token.txt"
            echo "IG_ACCESS_TOKEN を更新しました"
          fi
          rm -f "$RUNNER_TEMP/token.txt"
