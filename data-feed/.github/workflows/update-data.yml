name: Update college sports data

on:
  schedule:
    - cron: '17 3 * * 1'   # every Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install openpyxl
      - run: node scripts/download-eada.mjs
      - run: node scripts/fetch-ncaa.mjs
      - run: python3 scripts/build-athletics.py eada/schools.xlsx eada/instLevel.xlsx
      - run: node scripts/build-data.mjs
      - name: Commit if changed
        run: |
          git config user.name "college-data-bot"
          git config user.email "college-data-bot@users.noreply.github.com"
          git add public-data data
          git diff --cached --quiet || (git commit -m "chore: refresh college data" && git push)
